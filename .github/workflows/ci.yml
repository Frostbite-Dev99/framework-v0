# Required checks for every PR to main. Job `name:`s are the status-check names in branch protection.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta-files:
    name: Meta files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/CheckMetaFiles.sh

  asmdef-layers:
    name: Asmdef layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/CheckAsmdefLayers.py

  # --folder because Unity's .csproj files are generated locally and never committed
  csharp-format:
    name: C# format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet format whitespace . --folder --include Assets/_Framework/ Assets/_Game/ --verify-no-changes

  csharp-contract:
    name: C# contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/CheckCSharpContract.py

  unity-preflight:
    name: Unity preflight
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [[ -z "$UNITY_LICENSE" ]]; then
            echo "::warning::UNITY_LICENSE secret not set - Unity tests skipped. See Docs/03-ci-and-releases.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f ProjectSettings/ProjectVersion.txt ]]; then
            echo "::warning::Unity project not created yet - Unity tests skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  unity-tests:
    name: Unity tests
    needs: unity-preflight
    if: needs.unity-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

  # Smoke build on main only: catches Editor-only code leaking into the player build.
  unity-build:
    name: Unity build
    needs: [unity-preflight, unity-tests]
    if: github.event_name == 'push' && needs.unity-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
      - uses: actions/upload-artifact@v4
        with:
          name: Build-StandaloneLinux64
          path: build
          retention-days: 7
