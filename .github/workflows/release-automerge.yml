# Merges ONLY the release-please PR, once CI is green on it.
# Repo-level auto-merge stays OFF, so developers can't auto-merge their own PRs.
# The release-bot App is the only actor allowed to skip the lead review (see Scripts/SetupGitHubRepo.sh).
name: Release Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

env:
  RELEASE_BRANCH: release-please--branches--main

jobs:
  merge-release-pr:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release-please--branches--main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Squash-merge release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr merge "$RELEASE_BRANCH" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --match-head-commit "$HEAD_SHA"
